name: Daily Steam KR scan
on:
  schedule:
    - cron: '0 0 * * *' # 09:00 KST; GitHub may delay scheduled runs
  workflow_dispatch:
    inputs:
      max_games:
        description: '상세 조사 게임 수 (비워 두면 config.yaml 사용)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: steam-pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests (offline)
        run: python -m pytest -q
      - name: Collect and generate report
        shell: bash
        env:
          MAX_GAMES: ${{ inputs.max_games }}
        run: |
          set -o pipefail
          args=()
          if [ -n "$MAX_GAMES" ]; then
            args+=(--max-games "$MAX_GAMES")
          fi
          python -m src.main "${args[@]}" 2>&1 | tee scan.log
      - name: Preserve results and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-scan-${{ github.run_id }}
          path: |
            docs/
            scan.log
          retention-days: 30
          if-no-files-found: warn
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
